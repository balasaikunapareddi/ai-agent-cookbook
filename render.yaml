# Render Blueprint — free tier. Deploys the cookbook web UI (web/)
# as a public web service, straight from this repo. Every recipe
# demo runs in-process in mock mode: no API key, no network calls,
# no database — so there is nothing to configure in the dashboard.
#
# Free-tier notes: the instance spins down after 15 minutes idle and
# takes ~1 minute to wake on the next visit. Fine for a storefront.
services:
  - type: web
    name: ai-agent-cookbook
    env: python
    plan: free
    buildCommand: pip install -r web/requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
